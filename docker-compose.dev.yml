# Development overrides: Next.js dev server with live reload and Django debug pages.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Never expose this setup through the public tunnel.
services:
  backend:
    environment:
      - DEBUG=True
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Bind mounts from Windows/macOS don't deliver file events; poll instead
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
