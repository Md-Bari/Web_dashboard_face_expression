version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: emp_edu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emp_edu_db
      POSTGRES_USER: emp_edu_user
      POSTGRES_PASSWORD: emp_edu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emp_edu_user -d emp_edu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emp_edu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations accounts courses analytics &&
             python manage.py migrate &&
             python manage.py seed_data &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-emp-edu-supersecret-production-key
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_CHANNEL_LAYER=True
      # Celery beat aggregates snapshots in Docker, so the in-process aggregator stays off
      - INPROCESS_AGGREGATOR=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  inference_worker:
    build:
      context: ./backend/inference
      dockerfile: Dockerfile
    container_name: emp_edu_inference_worker
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./backend/inference:/app
      - ./backend/inference/models:/app/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emp_edu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:

