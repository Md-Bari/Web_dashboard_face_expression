
services:
  postgres:
    image: postgres:16-alpine
    container_name: emp_edu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emp_edu_db
      POSTGRES_USER: emp_edu_user
      POSTGRES_PASSWORD: emp_edu_password
    ports:
      # Host port is only for local DB tools; containers use postgres:5432 internally
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emp_edu_user -d emp_edu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: emp_edu_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      # Container listens on 8000; change BACKEND_PORT (e.g. in .env) if 8000 is taken on the host.
      # Public traffic still goes through nginx; this is only for local API/admin debugging.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      # Secrets and debug come from .env (see .env.example); the backend refuses to start without SECRET_KEY
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,.trycloudflare.com}
      - ALLOW_GUEST_STUDENTS=${ALLOW_GUEST_STUDENTS:-False}
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - USE_REDIS_CHANNEL_LAYER=True
      # Celery beat aggregates snapshots in Docker, so the in-process aggregator stays off
      - INPROCESS_AGGREGATOR=False
      # Extra HTTPS origins allowed to POST (admin login). Quick tunnels are trusted by default.
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      # Video meetings: set in .env (LiveKit Cloud project or your own LiveKit server)
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      # Ending a forgotten session also closes its meeting room
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: emp_edu_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - POSTGRES_DB=emp_edu_db
      - POSTGRES_USER=emp_edu_user
      - POSTGRES_PASSWORD=emp_edu_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emp_edu_frontend
    restart: unless-stopped
    environment:
      # Same-origin: nginx routes /api and /ws to the backend, so no absolute
      # backend URL is needed (and the app works behind the changing tunnel URL).
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_WS_URL=
    # Production build (next build + next start). After frontend edits: docker compose up -d --build frontend
    # For live-reload development use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    depends_on:
      - backend

  # Single public entry point. A Cloudflare quick tunnel can only point at one
  # origin, so cloudflared dials nginx and nginx splits by path: /api, /admin,
  # /static and /ws go to Django, everything else to Next.js.
  nginx:
    image: nginx:1.27-alpine
    container_name: emp_edu_nginx
    restart: unless-stopped
    ports:
      # Local entry point (also what cloudflared proxies). Change PUBLIC_PORT in .env if taken.
      - "${PUBLIC_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  # Exposes the stack at a random https://<name>.trycloudflare.com URL.
  # Read it with:  docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: emp_edu_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  postgres_data:

