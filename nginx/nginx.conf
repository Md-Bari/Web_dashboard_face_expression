# Single-origin reverse proxy for the EMP-EDU stack.
#
# A Cloudflare quick tunnel can only point at one origin, so cloudflared -> nginx
# and nginx splits the traffic by path:
#   /api /admin /static  -> Django (backend:8000)
#   /ws                  -> Django Channels websockets (backend:8000)
#   everything else      -> Next.js (frontend:3000)
#
# Because frontend and backend share one public hostname, the browser sends the
# auth cookies same-site and no CORS is required.
#
# NOTE: proxy_set_header directives are NOT merged across blocks - if a location
# sets any of them it drops the inherited ones, so the common headers are repeated
# in every location below.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Long read timeout so WebSocket (Django Channels / Next HMR) stays connected.
    proxy_read_timeout     3600s;
    proxy_send_timeout     3600s;
    proxy_connect_timeout  60s;

    # Only send "Connection: upgrade" when the client actually asks for an upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Resolve container names through Docker's DNS at request time (re-checked every 10 s).
    # A static `upstream` block resolves once at startup, so restarting the frontend or backend
    # container (new IP) left nginx proxying to the dead address -> 502 until nginx restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Variables make proxy_pass use the resolver above instead of a fixed IP
        set $emp_edu_backend  http://backend:8000;
        set $emp_edu_frontend http://frontend:3000;

        # Camera frames arrive as base64 JSON over the websocket, so allow large bodies.
        client_max_body_size 25m;

        # --- Django: REST API ---
        location /api/ {
            proxy_pass $emp_edu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # --- Django admin ---
        location /admin/ {
            proxy_pass $emp_edu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # --- Django static files (served by WhiteNoise) ---
        location /static/ {
            proxy_pass $emp_edu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # --- Django Channels websockets ---
        location /ws/ {
            proxy_pass $emp_edu_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering off;
        }

        # --- Next.js app (pages, assets and its own HMR websocket) ---
        location / {
            proxy_pass $emp_edu_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_buffering off;
        }
    }
}
